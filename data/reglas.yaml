# reglas.yaml
# Logica de opciones por codigo de mueble
# SOLO LECTURA — no modificar sin actualizar tambien la documentacion en Notion
#
# Estructura por mueble:
#   forzadas: opciones que se calculan automaticamente (el usuario no las ve)
#   facultativas: opciones que el usuario puede seleccionar en la interfaz
#
# "auto" significa que el valor se calcula en modulo_c.py segun la logica de mapeos

muebles:

  # -----------------------------------------------
  # MUEBLES BAJOS — ALMACENAMIENTO
  # -----------------------------------------------

  B308035:
    forzadas:
      op_103: auto   # Sentido de la veta (segun gama)
      op_104: auto   # Acabado canto frente (segun gama)
      op_200: auto   # Color interior (del CSV)
      op_203: "E14"  # Espesor canto mueble
      op_204: auto   # Acabado canto mueble (igual que op_200)
      op_206: "FSP"  # Sistema de cierre soft-motion
    facultativas:
      - op_121  # Sin mecanizado frente (SPF)
      - op_217  # Apertura Touch Latch (TL1)
      - op_223  # Cajon interior
      - op_231  # Reduccion de ancho — PENDIENTE formato con IT SG
      - op_700  # Mueble sin encolar (DEM)

  B458035: &base_B_1puerta
    forzadas:
      op_103: auto
      op_104: auto
      op_200: auto
      op_203: "E14"
      op_204: auto
      op_206: "FSP"
    facultativas:
      - op_121
      - op_217
      - op_223
      - op_231
      - op_700

  B608035:
    <<: *base_B_1puerta

  B908035: &base_B_2puertas
    forzadas:
      op_103: auto
      op_104: auto
      op_200: auto
      op_203: "E14"
      op_204: auto
      op_206: "FSP"
    facultativas:
      - op_121
      - op_223
      - op_700
    # Sin op_217 ni op_231 — 2 puertas

  B308057:
    <<: *base_B_1puerta
  B458057:
    <<: *base_B_1puerta
  B608057:
    <<: *base_B_1puerta
  B908057:
    <<: *base_B_2puertas

