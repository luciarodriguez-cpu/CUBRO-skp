                                                                                        "Lirio LAMINADO": "AII"
                                                                                          "Carbon LAMINADO": "ACB"
                                                                                            "Metal LAMINADO": "AMT"

                                                                                            # Campo Color del interior -> Opcion 200 (Color interior del mueble)
                                                                                            color_interior:
                                                                                              "Blanco mueble": "1CC"
                                                                                                "Gris mueble": "2CC"
                                                                                                  "Negro mueble": "3CC"
                                                                                                    "Roble mueble": "4CC"
                                                                                                    
                                                                                                    # Campo Tirador -> Opcion 217 (Sistema de apertura)
                                                                                                    # Solo aplica cuando el valor es 20 o 21
                                                                                                    apertura:
                                                                                                      "20": "TL1"   # Touch Latch
                                                                                                        "21": "PS1"   # Prise de main
                                                                                                        
                                                                                                        # Campo Tirador -> Opcion 300 (Tipo de tirador)
                                                                                                        # Cuando el valor NO es 20 ni 21
                                                                                                        tirador:
                                                                                                          "2": "ROU"    # Round
                                                                                                            "3": "SQU"    # Square
                                                                                                              "4": "Q2C"    # Curve horizontal — PENDIENTE confirmar distincion Q2C/Q2H
                                                                                                                "5": "Q3C"    # Line horizontal — PENDIENTE confirmar distincion Q3C/Q3H
                                                                                                                  "7": "Q1C"    # Plantea
                                                                                                                    "20": "499"   # Sin tirador (Touch Latch)
                                                                                                                      "21": "499"   # Sin tirador (Prise de main)
                                                                                                                      
                                                                                                                      # Campo Color tirador -> Opcion 301 (Color tirador integrado: Round y Square)
                                                                                                                      color_tirador_superficie:
