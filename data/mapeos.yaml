# mapeos.yaml
# Tablas de conversion de valores del CSV de SketchUp a codigos SG
# SOLO LECTURA — no modificar sin actualizar tambien la documentacion en Notion

# Campo D_Gama -> Opcion 100 (Gama del frente)
gama:
  "1": "LAC"   # Laca
    "2": "WOD"   # Wood
      "3": "LNO"   # Linoleum
        "4": "LMI"   # Laminado

        # Campo ColorFrente -> Opcion 101 (Acabado del frente)
        color_frente:
          # LACA
            "Crema LACA": "CR6"
              "Seda LACA": "SED"
                "Blanco LACA": "BAO"
                  "Petal LACA": "PEA"
                    "Vela LACA": "VL6"
                      "Marga LACA": "MAA"
                        "Zafiro LACA": "ZAF"
                          "Uva LACA": "UVA"
                            "Noche LACA": "NOE"
                              "Pino LACA": "PI6"
                                "Halo LACA": "HAL"
                                  "Grass LACA": "GRS"
                                    "Laurel LACA": "LAU"
                                      # WOOD
                                        "Nordic Oak WOOD": "TCK"
                                          "Oak WOOD": "TAK"
                                            "Smoked Oak WOOD": "TNK"
                                              # LINOLEUM
                                                "Mushroom LINOLEUM": "IMH"
                                                  "Macadamia LINOLEUM": "IMD"
                                                    "Clay LINOLEUM": "ICY"
                                                      "Walnut LINOLEUM": "IWL"
                                                        "Espresso LINOLEUM": "IES"
                                                          "Pistachio LINOLEUM": "IPI"
                                                            "Olive LINOLEUM": "IOL"
                                                              "Conifer LINOLEUM": "ICO"
