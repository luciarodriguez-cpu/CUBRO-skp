                                                                                                                                  # Campo Trasera -> Opcion 301 (Color tirador de superficie: Curve, Line, Plantea)
                                                                                                                                  color_tirador_integrado:
                                                                                                                                    "Crema": "CR6"
                                                                                                                                      "Seda": "SED"
                                                                                                                                        "Blanco": "BAO"
                                                                                                                                          "Petal": "PEA"
                                                                                                                                            "Vela": "VL6"
                                                                                                                                              "Marga": "MAA"
                                                                                                                                                "Zafiro": "ZAF"
                                                                                                                                                  "Uva": "UVA"
                                                                                                                                                    "Noche": "NOE"
                                                                                                                                                      "Pino": "PI6"
                                                                                                                                                        "Halo": "HAL"
                                                                                                                                                          "Grass": "GRS"
